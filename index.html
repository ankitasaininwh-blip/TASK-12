<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compound Interest Calculator</title>

    <!-- CSS File -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Compound Interest Calculator</h1>

        <div class="box">
            <p><strong>Principal:</strong> ₹100000</p>
            <p><strong>Rate:</strong> 5%</p>
            <p><strong>Compounded:</strong> 4 times/year</p>
            <p><strong>Time:</strong> 2 years</p>

            <h2 id="result"></h2>
        </div>
    </div>

    <!-- JavaScript File -->
    <script src="script.js"></script>

</body>
</html>
